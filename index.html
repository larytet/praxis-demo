<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Praxis Check-in Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Concept: Empfang | Arztansicht mit Hinweis-Kacheln | Datenschutz. Auf grossen Bildschirmen drei Spalten, alle Groessen in rem und skalieren mit der Breite.
   Farbe: kuehles Papierweiss, Tinte, Petrol-Akzent; Ampelfarben nur fuer Zustand; Rosa nur fuer den Blick. */
:root{--bg:#F1F4F6;--card:#FFFFFF;--ink:#14212B;--muted:#5A6B78;--line:#D8E0E6;--accent:#0B6E8A;--accent-soft:#E2F0F4;--ok:#1B7F54;--ok-soft:#E1F2EA;--warn:#9A6200;--warn-soft:#FBEFD6;--stage:#E9EEF1;--gz:#D6336C;--bad:#C0392B;
--ui:'IBM Plex Sans','IBM Plex Sans Hebrew',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono','IBM Plex Sans Hebrew',ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1318;--card:#131C23;--ink:#E7EEF3;--muted:#93A5B2;--line:#25333D;--accent:#5CC0DC;--accent-soft:#12303A;--ok:#4CC38A;--ok-soft:#10301F;--warn:#E3B04B;--warn-soft:#352A10;--stage:#0F181E;--gz:#FF7AA8;--bad:#FF7B72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1318;--card:#131C23;--ink:#E7EEF3;--muted:#93A5B2;--line:#25333D;--accent:#5CC0DC;--accent-soft:#12303A;--ok:#4CC38A;--ok-soft:#10301F;--warn:#E3B04B;--warn-soft:#352A10;--stage:#0F181E;--gz:#FF7AA8;--bad:#FF7B72;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:clamp(13px,min(calc(10px + .45vw),calc(5px + 1.2vh)),26px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:1rem;line-height:1.5;padding-block:1.2rem 2.5rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:none;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap;margin-bottom:1rem}
header.top h1{margin:0;font-size:1.35rem;font-weight:600;letter-spacing:-.005em}
header.top p{margin:.1rem 0 0;color:var(--muted);font-size:.85rem}
.hdr-r{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.demo{font:500 .75rem var(--mono);border:1px solid var(--warn);color:var(--warn);background:var(--warn-soft);border-radius:.4rem;padding:.2rem .5rem;white-space:nowrap}
.langdd{position:relative}
.langcur{display:flex;align-items:center;gap:.5rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.35rem .75rem;color:var(--ink);font:500 .85rem var(--ui);cursor:pointer}
.langcur:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.langcur .lf{display:flex}
.langcur .lf svg{width:1.3rem;height:.9rem;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.langcur .lc{width:1rem;height:1rem;flex:none;transition:transform .15s}
.langcur[aria-expanded="true"] .lc{transform:rotate(180deg)}
.lang{position:absolute;top:calc(100% + .3rem);inset-inline-end:0;min-width:10.5rem;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:.6rem;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:.25rem;display:flex;flex-direction:column}
.lang[hidden]{display:none}
.lang button:hover{background:var(--bg)}
.lang button{display:flex;align-items:center;gap:.6rem;width:100%;background:none;border:0;border-radius:.4rem;color:var(--ink);padding:.5rem .7rem;font:500 .85rem var(--ui);cursor:pointer;text-align:start}
.lang button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.lang svg{width:1.3rem;height:.9rem;border-radius:2px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.layout{display:grid;gap:1rem;grid-template-columns:minmax(0,1fr);grid-template-areas:"emp" "doc" "law";align-items:start}
@media (min-width:900px){.layout{grid-template-columns:minmax(17rem,5fr) minmax(0,8fr);grid-template-areas:"emp doc" "law law"}}
@media (min-width:1500px){.layout{grid-template-columns:minmax(17rem,3fr) minmax(0,6.4fr) minmax(17rem,3fr);grid-template-areas:"emp doc law"}}
.p-emp{grid-area:emp}.p-doc{grid-area:doc}.p-law{grid-area:law}
.panel{background:var(--card);border:1px solid var(--line);border-radius:.8rem;padding:1.05rem 1.2rem;min-width:0}
.panel h2{margin:0 0 .15rem;font-size:.75rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.panel .sub{margin:0 0 .8rem;font-size:.85rem;color:var(--muted)}
/* Empfang */
.stage{position:relative;height:13.5rem;border-radius:.65rem;background:var(--stage);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.stage svg.sil{width:11rem;height:auto;max-height:11.2rem}
.frame{position:absolute;inset:1.6rem 20%;pointer-events:none;opacity:0;transition:opacity .25s}
.frame i{position:absolute;width:1.4rem;height:1.4rem;border:3px solid var(--accent)}
.frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:6px}
.frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:6px}
.frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:6px}
.frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:6px}
.scan{position:absolute;left:20%;right:20%;top:1.6rem;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent);opacity:0}
.stage[data-s="scan"] .frame,.stage[data-s="match"] .frame{opacity:1}
.stage[data-s="match"] .frame i{border-color:var(--ok)}
@media (prefers-reduced-motion:no-preference){.stage[data-s="scan"] .scan{opacity:1;animation:sweep 1.4s ease-in-out infinite}@keyframes sweep{0%,100%{top:1.6rem}50%{top:calc(100% - 1.7rem)}}}
.egk{position:absolute;inset-inline-start:.9rem;bottom:.9rem;opacity:0;font:500 .75rem var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:.4rem;padding:.2rem .5rem;transition:opacity .25s}
.stage[data-s="egk"] .egk{opacity:1}
.cap{position:absolute;inset-inline-start:.75rem;bottom:.6rem;font-size:.7rem;color:var(--muted)}
.capr{position:absolute;inset-inline-end:.75rem;top:.6rem;font:500 .7rem var(--mono);color:var(--muted)}
.stage[data-s="egk"] .cap,.stage[data-s="egk"] .capr{display:none}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap;margin:.9rem 0 .4rem}
.consent{display:flex;align-items:center;gap:.65rem;font-size:.85rem}
.tg{width:2.75rem;height:1.6rem;border-radius:.8rem;border:1px solid var(--line);background:var(--line);position:relative;cursor:pointer;padding:0;flex:none}
.tg i{position:absolute;top:.12rem;inset-inline-start:.12rem;width:1.25rem;height:1.25rem;border-radius:50%;background:var(--muted);transition:transform .15s}
.tg[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.tg[aria-checked="true"] i{transform:translateX(1.1rem);background:var(--card)}
[dir="rtl"] .tg[aria-checked="true"] i{transform:translateX(-1.1rem)}
.tg:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border-radius:.5rem;border:1px solid var(--line);background:transparent;color:var(--ink);padding:.55rem .9rem;font:500 .9rem var(--ui);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:.5rem;flex-wrap:wrap}
ol.steps{list-style:none;margin:.8rem 0 0;padding:0;border-top:1px solid var(--line)}
ol.steps li{display:flex;align-items:center;gap:.65rem;padding:.55rem 0;border-bottom:1px solid var(--line);font-size:.9rem;color:var(--muted)}
ol.steps .d{flex:none;width:1.4rem;height:1.4rem;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:500 .7rem var(--mono)}
ol.steps li.act{color:var(--ink)}
ol.steps li.act .d{border-color:var(--accent);color:var(--accent)}
ol.steps li.done{color:var(--ink)}
ol.steps li.done .d{background:var(--ok);border-color:var(--ok);color:var(--card)}
.confirm{margin-top:.8rem;border:1px solid var(--accent);background:var(--accent-soft);border-radius:.65rem;padding:.8rem .9rem}
.confirm p{margin:0 0 .65rem;font-size:.9rem}
.confirm[hidden]{display:none}
.status{margin:.65rem 0 0;font-size:.85rem;color:var(--muted);min-height:1.3rem}
.msearch{margin-top:.8rem;border:1px solid var(--accent);background:var(--accent-soft);border-radius:.65rem;padding:.8rem .9rem}
.msearch[hidden]{display:none}
.msearch label{display:block;font-size:.85rem;margin-bottom:.4rem}
.msearch input{width:100%;font:500 1rem var(--ui);padding:.55rem .7rem;border-radius:.5rem;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.msearch input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
ul.msr{list-style:none;margin:.5rem 0;padding:0;max-height:15rem;overflow-y:auto}
.msr li.msn{padding:.45rem .2rem;font-size:.85rem;color:var(--muted)}
.msr button{display:block;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:.5rem;padding:.5rem .7rem;margin-bottom:.35rem;color:var(--ink);font:inherit;cursor:pointer}
.msr button:hover,.msr button:focus-visible{border-color:var(--accent);outline:none}
.msr .nm{font-weight:600}
.msr .ag{color:var(--muted);font-size:.85rem}
.msr small{display:block;color:var(--muted);font-size:.78rem}
mark{background:var(--warn-soft);color:inherit;border-radius:2px;padding:0 1px}
@media (min-width:800px){.tile.wide{grid-column:span 2}}
.rxtc{align-items:flex-start}
.rxl{display:block;flex:1;min-width:0}
.rxr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:.6rem;align-items:center;padding:.3rem 0;border-top:1px solid var(--line);font-size:.9rem}
.rxr:first-child{border-top:0}
.rxr .rn{font-weight:500}
.rxr .rd{color:var(--muted);font-size:.8rem}
.rxscroll{overflow-x:auto}
table.rxt{width:100%;border-collapse:collapse;margin:.4rem 0}
.rxt th,.rxt td{text-align:start;padding:.4rem .6rem .4rem 0;border-bottom:1px solid var(--line);font-size:.82rem;vertical-align:top}
.rxt th{font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500}
.ad{margin-top:.7rem}
.ad b{display:block;font-size:.8rem}
.adbar{position:relative;height:.65rem;border-radius:.35rem;background:var(--line);margin:.5rem 0;direction:ltr}
.adbar i{position:absolute;left:0;top:0;bottom:0;border-radius:.35rem;background:var(--ok)}
.adbar u{position:absolute;top:-.2rem;bottom:-.2rem;width:2px;background:var(--ink);left:80%;text-decoration:none}
.ad p{margin:.2rem 0;font-size:.8rem;color:var(--muted)}
.rxsrc{margin:.5rem 0 0;font-size:.75rem;color:var(--muted)}
.rxt tr.fl td{background:var(--warn-soft)}
.tc .v.sm{font-size:1rem;font-family:var(--mono);line-height:1.6}
.rxt .why{display:block;font-size:.82rem;margin-top:.2rem;color:var(--ink)}
.rxt tr.grp td{font-size:.72rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-top:.9rem}
.rxt small{display:block;color:var(--muted);font-size:.72rem}
.nx{margin-top:1.5rem;border-top:1px solid var(--line);padding-top:1rem}
.nx h3{margin:1rem 0 .2rem;font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.nx>h3:first-child{margin-top:0}
.nxrow{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;margin:.6rem 0}
.nxrow label,.nxrow .lbl{font-size:.8rem;color:var(--muted)}
.nxin{flex:1;min-width:12rem;font:500 .95rem var(--ui);padding:.5rem .65rem;border-radius:.5rem;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.nxin:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nxdocs{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:.8rem;margin-top:.7rem;align-items:start}
.nxd{border:1px solid var(--line);border-radius:.75rem;padding:.8rem .9rem;background:var(--card);min-width:0}
.nxd.ok{border-color:var(--ok)}
.nxd h4{margin:0 0 .2rem;font-size:.95rem}
.nxd p{margin:.1rem 0 .55rem;font-size:.8rem;color:var(--muted)}
.nxd pre{white-space:pre-wrap;word-break:break-word;font:400 .78rem/1.55 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:.5rem;padding:.6rem .7rem;margin:.6rem 0 0;max-height:18rem;overflow:auto;direction:ltr;text-align:left}
.nxd pre mark{background:var(--warn-soft);color:var(--warn);padding:0 2px;border-radius:2px}
.nxt{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:.7rem;align-items:center;padding:.5rem 0;border-top:1px solid var(--line);font-size:.88rem}
.nxt:first-child{border-top:0}
.nx ul{margin:.4rem 0 0;padding-inline-start:1.2rem;font-size:.85rem}
.nx ul li{margin:.2rem 0}
.reason{display:flex;flex-wrap:wrap;gap:.25rem .9rem;align-items:baseline;margin-top:.8rem;padding:.6rem .9rem;border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:.6rem;background:var(--card)}
.reason .rl{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.reason .rt2{font-weight:600}
.reason .rp{color:var(--muted);font-size:.9rem}
.reason .rh{color:var(--warn);font-size:.9rem;font-weight:500}
.stagebar{display:flex;gap:.6rem;margin-top:.8rem}
.stagebtn{flex:1;display:flex;align-items:center;gap:.65rem;padding:.65rem .95rem;border:1px solid var(--line);border-radius:.7rem;background:var(--card);color:var(--ink);font:600 .95rem var(--ui);cursor:pointer;text-align:start}
.stagebtn b{flex:none;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--line);display:grid;place-items:center;font:600 .8rem var(--mono)}
.stagebtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.stagebtn[aria-pressed="true"] b{background:var(--accent);color:var(--card)}
.stagebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[data-gz].gz{box-shadow:0 0 0 3px var(--gz)}
.chart[data-st="1"] .st2{display:none}
.chart[data-st="2"] .st1{display:none}
.nx{margin-top:.8rem;border-top:0;padding-top:0}
.nxtop{display:flex;flex-wrap:wrap;gap:.7rem;align-items:flex-end}
.nxf{display:flex;flex-direction:column;gap:.2rem}
.nxf.grow{flex:1;min-width:14rem}
.nxf .lbl{font-size:.75rem;color:var(--muted)}
.nxgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem;align-items:start;margin-top:.4rem}
@media (max-width:760px){.nxgrid{grid-template-columns:minmax(0,1fr)}}
.nxdocs{display:block;margin-top:.3rem}
.nxr{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:.5rem;align-items:center;padding:.4rem .1rem;border-top:1px solid var(--line);font-size:.88rem}
.nxr:first-child{border-top:0}
.nxr.sel{background:var(--accent-soft);border-radius:.4rem;padding-inline:.4rem}
.nxr.ok .nxn{color:var(--ok)}
.nxr .btn{padding:.3rem .65rem;font-size:.8rem}
.nxpane{border:1px solid var(--line);border-radius:.75rem;padding:.7rem .85rem;min-width:0}
.nxpane h4{margin:.6rem 0 .1rem;font-size:.95rem}
.nxpane pre{white-space:pre-wrap;word-break:break-word;font:400 .78rem/1.55 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:.5rem;padding:.6rem .7rem;margin:.5rem 0 0;max-height:calc(100vh - 24rem);min-height:10rem;overflow:auto;direction:ltr;text-align:left}
.nxpane pre mark{background:var(--warn-soft);color:var(--warn);padding:0 2px;border-radius:2px}
/* Arztansicht */
.empty{display:grid;place-items:center;text-align:center;min-height:24rem;color:var(--muted);padding:1.2rem}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:.25rem;font-size:1.1rem}
.chart[hidden],.empty[hidden]{display:none}
.pt{display:flex;justify-content:space-between;align-items:flex-start;gap:.8rem;flex-wrap:wrap;padding-bottom:.8rem;border-bottom:1px solid var(--line)}
.pt h3{margin:0;font-size:1.7rem;font-weight:600;letter-spacing:-.01em}
.pt .meta{margin:.15rem 0 0;color:var(--muted);font-size:.85rem;font-family:var(--mono)}
.pill{display:inline-block;font:500 .75rem var(--ui);border:1px solid currentColor;border-radius:999px;padding:.12rem .65rem;white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-soft)}
.pill.warn{color:var(--warn);background:var(--warn-soft)}
.pill.info{color:var(--accent);background:var(--accent-soft)}
.tools{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-top:.9rem}
.tools .lbl{font-size:.8rem;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-wrap:wrap}
.seg button{background:none;border:0;color:var(--muted);padding:.4rem .9rem;font:500 .85rem var(--ui);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.hintline{margin:.5rem 0 0;font-size:.85rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));grid-auto-flow:dense;gap:.8rem;align-items:start;margin-top:.9rem}
.tile{border:1px solid var(--line);border-radius:.75rem;background:var(--card);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.tile.warn{border-color:var(--warn)}
.tile.open{border-color:var(--accent)}

.tile.gz{box-shadow:0 0 0 3px var(--gz)}
.tbtn{all:unset;display:block;width:100%;box-sizing:border-box;padding:.8rem .95rem;cursor:pointer}
.tbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tl{display:block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tc{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;margin-top:.2rem}

.tc .v.txt{font-family:var(--ui);font-size:1.5rem}

.tile.open .tc svg{transform:rotate(180deg)}
.tf{margin-top:.35rem;min-height:1.4rem}
.td{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}

.dt{margin:0 0 .5rem;font-size:.95rem}
.ev{margin-top:.6rem}
.ev b{display:block;font-size:.8rem;font-weight:600}
.ev span{display:block;font-size:.72rem;color:var(--muted);margin-bottom:.35rem}
ol.trl{list-style:none;margin:0;padding:0}

.trl .tm{font:400 .72rem var(--mono);padding-top:.1rem}
.trl .wh{font-weight:500}
.trl li.hl{background:var(--accent-soft);color:var(--ink);border-inline-start-color:var(--accent)}

.range{margin-top:.7rem}
.range .rt{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin-bottom:.4rem}
.track{position:relative;height:.65rem;border-radius:.35rem;background:var(--line);direction:ltr}
.band{position:absolute;top:0;bottom:0;border-radius:.35rem;background:var(--ok-soft);border:1px solid var(--ok)}
.mk{position:absolute;top:-.25rem;width:4px;height:1.15rem;border-radius:2px;transform:translateX(-2px)}

"l.h":"Data protection and law in Germany","l.sub":"This is how the process would be secured in a real practice. Not legal advice; check with the data protection officer before use.",
"l1.t":"Explicit consent","l1.p":"Face data used for identification is a special category of personal data (Art. 9 GDPR). Consent is voluntary and can be withdrawn. The electronic health card (eGK) is always offered as an alternative.",
"l2.t":"No traits from the face","l2.p":"The face is only used to recognize the patient. Ancestry, family and blood group are never estimated from the image, because the EU AI Act prohibits biometric categorisation by ethnic origin. The details come from earlier conversations.",
"l3.t":"Recorded conversations with evidence","l3.p":"Recording and transcript only with the patient's explicit consent (Art. 9 GDPR, § 201 StGB on the confidentiality of the spoken word). The AI proposes facts and shows the passage as evidence. Only after the doctor confirms does anything enter the record.",
"l4.t":"A human confirms","l4.p":"A match opens the record only after the medical assistant has confirmed it. This prevents mix-ups and is the safeguard against errors.",
"l5.t":"Data storage","l5.p":"No images are ever stored, only a protected face template (biometric template protection per ISO/IEC 24745: irreversible, renewable), only locally or in the EU. It is still biometric data (Art. 9 GDPR) and is deleted on withdrawal of consent. Medical documentation is kept for 10 years (§ 630f BGB).",
"l6.t":"Gaze data","l6.p":"Gaze tracking can reveal personal and health information. Use only with the user's consent, process locally, do not store.",
"l7.t":"Integration with the practice software","l7.p":"A real version reads and writes through interfaces of the practice management system (e.g. GDT or FHIR with KBV-MIO). Nothing is connected in this demo.",

"d.chg":"The system stores only the code, for example A7 for eyebrow grooming level 7. Here the same information is also shown as text. A flag appears when the change reaches the threshold for that feature. For asking only: the code does not say why.","chg.n12":"Skin colour compared with her usual (F)","chg.s12":"0 as usual, 1 paler, 2 more yellow, 3 redder, 4 more bluish","chg.n13":"Nails and fingertips, condition (N)","chg.s13":"0 to 4, higher = more changed","chg.n14":"Nails, surface (U)","chg.s14":"0 smooth, 1 longitudinal ridges, 2 transverse ridges, 3 pitting","chg.n15":"Nails, shape (K)","chg.s15":"0 normal, 1 clubbing (watch-glass), 2 spoon-shaped","chg.n16":"Skin of the hands (D)","chg.s16":"0 to 4, higher = more changed","chg.n17":"Skin of the arms (M)","chg.s17":"0 to 4, higher = more changed","chg.n18":"Skin of the feet, only with open shoes (X)","chg.s18":"0 to 4, higher = more changed","chg.lv.V.0":"none","chg.lv.V.1":"glasses","chg.lv.V.2":"contact lenses","chg.lv.F.0":"as usual","chg.lv.F.1":"paler than usual","chg.lv.F.2":"more yellow than usual","chg.lv.F.3":"redder than usual","chg.lv.F.4":"more bluish than usual","chg.lv.U.0":"smooth","chg.lv.U.1":"longitudinal ridges","chg.lv.U.2":"transverse ridges","chg.lv.U.3":"pitting","chg.lv.K.0":"normal","chg.lv.K.1":"clubbing","chg.lv.K.2":"spoon-shaped","chg.lv.R.0":"none","chg.lv.R.1":"healed","chg.lv.R.2":"fresh","chg.m1":"Slightly","chg.m2":"Clearly","chg.m3":"Much","chg.hi":"higher","chg.lo":"lower","chg.tpl":"{m} {d} than last visit (level {b} → {a})","chg.same":"Unchanged (level {a})","chg.cattpl":"Before: {b}. Today: {a}.","chg.catsame":"Unchanged: {a}","chg.src":"Levels proposed by camera and microphone, confirmed by the medical assistant or the doctor. Only codes are stored, no images or recordings. Conjunctiva, sclera, earlobes, piercing, fingertips, nails, hands, arms and feet (only with open shoes): high-resolution video or close-up at the measuring station. Voice: compared with the recordin "l3.t":"Kanıtlı görüşme kaydı","l3.p":"Kayıt ve döküm yalnızca hastanın açık rızasıyla yapılır (GDPR madde 9, sözün gizliliğine ilişkin § 201 StGB). Yapay zekâ bilgi önerir ve ilgili pasajı kanıt olarak gösterir. Kayda ancak doktor onayladıktan sonra bir şey girer.",
"l4.t":"İnsan onaylar","l4.p":"Bir eşleşme, dosyayı ancak tıbbi asistan onayladıktan sonra açar. Bu, karışıklıkları önler ve hatalara karşı güvencedir.",
"l5.t":"Veri saklama","l5.p":"Hiçbir görüntü saklanmaz, yalnızca korumalı bir yüz şablonu (ISO/IEC 24745'e göre biyometrik şablon koruması: geri döndürülemez, yenilenebilir); yalnızca yerel olarak veya AB içinde. Yine de biyometrik veridir (GDPR md. 9) ve rıza geri alınınca silinir. Tıbbi dokümantasyon 10 yıl saklanır (§ 630f BGB).",
"l6.t":"Bakış verileri","l6.p":"Bakış takibi kişi ve sağlık hakkında bilgi ortaya çıkarabilir. Yalnızca kullanıcının rızasıyla, yerel işlenerek, saklanmadan kullanın.",
"l7.t":"Muayenehane yazılımına bağlantı","l7.p":"Gerçek sürüm, muayenehane yönetim sisteminin arayüzleri üzerinden okur ve yazar (örn. GDT veya KBV-MIO ile FHIR). Bu demoda hiçbir şey bağlı değil.",

function chgText(r){

var ring=$("#gaze"),gzp=$("#gzp"),CIRC=163.4,DWELL=800;
var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;
var gz={x:0,y:0,tx:0,ty:0,tile:null,li:null,dwell:0,last:0,raf:0,active:false};
function startRing(){
  if(!gz.x&&!gz.y){gz.x=gz.tx=window.innerWidth/2;gz.y=gz.ty=window.innerHeight/2}
  ring.classList.add("on");
  if(!gz.active){gz.active=true;gz.last=0;gz.raf=requestAnimationFrame(loop)}
}
function stopRing(){
  gz.active=false;cancelAnimationFrame(gz.raf);ring.classList.remove("on","dw");
  if(gz.tile)gz.tile.classList.remove("gz");
  if(gz.li)gz.li.classList.remove("gz");
  gz.tile=null;gz.li=null;gz.dwell=0;gzp.style.strokeDashoffset=CIRC;
}
function loop(ts){
  if(!gz.active)return;
  var dt=gz.last?Math.min(64,ts-gz.last):16;gz.last=ts;
  var e=reduce?1:0.14;
  gz.x+=(gz.tx-gz.x)*e;gz.y+=(gz.ty-gz.y)*e;
  ring.style.transform="translate("+gz.x+"px,"+gz.y+"px)";
  var el=document.elementFromPoint(gz.x,gz.y);
  var tile=el&&el.closest?el.closest(".tile,[data-gz]"):null;
  var li=el&&el.closest?el.closest(".trl li"):null;
  if(li!==gz.li){if(gz.li)gz.li.classList.remove("gz");gz.li=li;if(li)li.classList.add("gz")}
  if(tile!==gz.tile){
    if(gz.tile)gz.tile.classList.remove("gz");
    gz.tile=tile;gz.dwell=0;gz.fired=false;
    if(tile)tile.classList.add("gz");
  }else if(tile&&!tile.classList.contains("open")&&!gz.fired){
    gz.dwell+=dt;
    if(gz.dwell>=DWELL){if(tile.classList.contains("tile"))setOpen(tile.getAttribute("data-k"),true,true);else{gz.fired=true;tile.click()}gz.dwell=0}
  }
  var prog=(tile&&!tile.classList.contains("open")&&!gz.fired)?Math.min(gz.dwell/DWELL,1):0;
  gzp.style.strokeDashoffset=CIRC*(1-prog);
  ring.classList.toggle("dw",prog>0);
  gz.raf=requestAnimationFrame(loop);
}

function setMode(m){

  document.querySelectorAll("#modes button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-m")===m?"true":"false")});
  modeHint.textContent=t("hint."+m);
  if(m==="click"||chart.hidden){stopRing()}
  else{startRing()}

}
function runTour(){
  var keys=["pulse","rx","chg","opn","ddi","wtb","lab","prev",{sel:'.stagebtn[data-s="2"]'},{sel:'[data-nx="prev"][data-n="1"]'},{sel:'[data-nx="pane"][data-p="bill"]'}],i=0,my=run;setStage("1");
  Object.keys(openSet).forEach(function(k){setOpen(k,false)});
  function step(){
    if(mode!=="tour"||my!==run)return;
    if(i>=keys.length){later(function(){if(mode==="tour")setMode("click")},1800);return}
    var ky=keys[i],tile=(typeof ky==="string")?tilesEl.querySelector('.tile[data-k="'+ky+'"]'):document.querySelector(ky.sel);
    if(!tile){i++;step();return}
    tile.scrollIntoView({block:"nearest"});
    later(function(){
      var r=(tile.querySelector(".tbtn")||tile).getBoundingClientRect();
      gz.tx=r.left+r.width/2;gz.ty=r.top+r.height/2;
      i++;
      later(step,DWELL+1500+2400);
    },80);
  }
  step();
}

function nrm(s){return s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ı/g,"i").replace(/ß/g,"ss").toLowerCase()}
function words(s){return nrm(s).split(/[\s,\-]+/).filter(Boolean)}
function matchP(p,tk){var ws=words(p.last+" "+p.first+" "+p.kids.join(" "));return tk.every(function(q){return ws.some(function(w){return w.indexOf(q)===0})})}
function hl(text,tk){return text.replace(/[^\s,\-]+/g,function(w){var n=nrm(w);for(var i=0;i<tk.length;i++){if(n.indexOf(tk[i])===0)return "<mark>"+w.slice(0,tk[i].length)+"</mark>"+w.slice(tk[i].length)}return w})}

  var res=PAT.filter(function(p){return matchP(p,tk)});
